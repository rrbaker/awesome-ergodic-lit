<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f0e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1712" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="{{ '/assets/fonts/literata-latin-opsz-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {%- if page.alpine %}
  <script defer src="{{ '/assets/js/filters.js' | relative_url }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous"></script>
  {%- endif %}
</head>
<body>
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-6 focus:top-6 focus:z-10 focus:bg-ink focus:px-4 focus:py-2 focus:text-paper">Skip to content</a>

  {% include header.html %}

  <main id="main" class="mx-auto max-w-3xl px-6 pb-8">
    {{ content }}
  </main>

  {% include footer.html %}
  <script src="{{ '/assets/js/email.js' | relative_url }}"></script>
</body>
</html>
