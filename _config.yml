# Jekyll site configuration.
# Jekyll reads this once at startup; restart `jekyll serve` after editing it.

title: Awesome Ergodic Literature
description: >-
  A curated list of ergodic literature (texts that take nontrivial effort to
  traverse), structured by reading mechanics.

# Where the site lives: https://ergodic.rrbaker.com (a custom domain set in
# the repo's Pages settings, so there's no sub-path and baseurl is empty).
# Canonical links, the sitemap, and README.md links are built from these.
url: https://ergodic.rrbaker.com
baseurl: ""

repository: rrbaker/awesome-ergodic-lit

# Files Jekyll should not copy into the built site.
exclude:
  - README.md
  - CONTRIBUTING.md
  - VERIFICATION.md
  - LICENSE
  - LICENSE-CODE
  - Gemfile
  - Gemfile.lock
  - lychee.toml
  - scripts/
  - assets/css/input.css
  - vendor/
  - .bin/
