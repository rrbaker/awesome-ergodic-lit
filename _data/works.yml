  year: 2006
  original_language: English
  medium: print
  needs_physical: true
  mechanics:
    - multiple-paths
    - typographic
  summary: >-
    Two narrators’ accounts start from opposite covers, printed upside down
    relative to each other; the reader flips the book back and forth, usually
    eight pages at a time, alongside marginal chronology columns.
  links:
    - label: Wikipedia
      url: https://en.wikipedia.org/wiki/Only_Revolutions
  verified: false

