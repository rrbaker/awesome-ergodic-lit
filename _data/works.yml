# One entry per work. This file is the source of truth for the site and for
# the generated sections of README.md (run scripts/build-readme after editing).
#
# Fields:
#   id                kebab-case, unique; becomes the page URL /works/<id>/
#   title, author     as commonly published
#   title_language    optional; language code (fr, es, de...) when the title
#                     isn't English, so screen readers pronounce it correctly
#   year              first publication
#   original_language
#   medium            print | digital | hybrid
#   needs_physical    true if the ergodic effect depends on the physical object
#   mechanics         ids from _data/mechanics.yml; list the dominant one FIRST
#                     (README.md groups each work under its first mechanic)
#   summary           one or two sentences on what the reader must do
#   links             label + url pairs
#   verified          false until a human has checked the entry (see CONTRIBUTING.md)

- id: house-of-leaves
  title: House of Leaves
  author: Mark Z. Danielewski
  year: 2000
  original_language: English
  medium: print
  needs_physical: true
  mechanics:
    - footnote-maze
    - typographic
  summary: >-
    The reader follows nested footnotes, appendices, and an index across
    several narrators, and has to turn the book, read mirrored text, and track
    passages that thin to a few words per page.
  links:
    - label: Wikipedia
      url: https://en.wikipedia.org/wiki/House_of_Leaves
    - label: Author's site
      url: https://www.markzdanielewski.com/
  verified: false

- id: only-revolutions
